<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restricted — i-SAIRAS / i-SpaRo 2026 Workshop</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy:    #070E1A;
    --navy2:   #0D1E35;
    --navy3:   #1B3D6E;
    --cyan:    #00D4FF;
    --cyan2:   #0099CC;
    --gold:    #F5C842;
    --white:   #EEF3FA;
    --muted:   #8BA8C8;
    --border:  rgba(0,212,255,0.15);
    --card-bg: rgba(27,61,110,0.25);
    --error:   #FF6B6B;
  }

  html, body {
    height: 100%;
    background: var(--navy);
    color: var(--white);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    position: relative;
    overflow: hidden;
  }

  /* subtle starfield */
  .stars {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image:
      radial-gradient(1.5px 1.5px at 10% 20%, rgba(255,255,255,0.55), transparent),
      radial-gradient(1px 1px at 80% 10%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1.5px 1.5px at 60% 70%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 30% 85%, rgba(255,255,255,0.35), transparent),
      radial-gradient(1.5px 1.5px at 90% 60%, rgba(255,255,255,0.45), transparent),
      radial-gradient(1px 1px at 45% 35%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1.5px 1.5px at 20% 55%, rgba(255,255,255,0.4), transparent);
    background-repeat: no-repeat;
    pointer-events: none;
    opacity: 0.8;
  }

  .glow {
    position: fixed;
    top: -20%; left: 50%;
    transform: translateX(-50%);
    width: 700px; height: 700px;
    background: radial-gradient(circle, rgba(0,212,255,0.10), transparent 70%);
    pointer-events: none;
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 2.5rem 2.25rem;
    backdrop-filter: blur(10px);
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--cyan);
    margin-bottom: 0.9rem;
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 1.3rem;
    line-height: 1.35;
    margin-bottom: 0.6rem;
  }

  .sub {
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.5;
    margin-bottom: 1.75rem;
  }

  form { display: flex; flex-direction: column; gap: 0.85rem; }

  input[type="password"] {
    width: 100%;
    background: rgba(7,14,26,0.6);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem 0.9rem;
    color: var(--white);
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input[type="password"]::placeholder { color: #5B7393; }
  input[type="password"]:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 0 3px rgba(0,212,255,0.15);
  }
  input[type="password"].shake {
    border-color: var(--error);
    animation: shake 0.32s ease;
  }
  @keyframes shake {
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  button {
    background: var(--cyan);
    color: var(--navy);
    border: none;
    border-radius: 8px;
    padding: 0.75rem 1rem;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 0.92rem;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  button:hover { background: var(--cyan2); }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.6; cursor: wait; }

  .error {
    color: var(--error);
    font-size: 0.83rem;
    margin-top: 0.6rem;
  }

  .remember {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 1.1rem;
    color: var(--muted);
    font-size: 0.82rem;
    cursor: pointer;
    user-select: none;
  }
  .remember input { accent-color: var(--cyan); }

  .footnote {
    margin-top: 1.5rem;
    padding-top: 1.1rem;
    border-top: 1px solid var(--border);
    color: #506070;
    font-size: 0.75rem;
    line-height: 1.5;
  }

  @media (prefers-reduced-motion: reduce) {
    .shake { animation: none; }
  }
</style>
</head>

  <h1>Enabling Modularity &amp; Interoperability in Space Robotics</h1>

    <button type="submit" id="gate-submit">Unlock →</button>
    <p class="error" id="gate-error" hidden>Incorrect password. Please try again.</p>
  </form>

  <label class="remember">
    <input type="checkbox" id="gate-remember">
    Remember me on this device
  </label>

  <p class="footnote">i-SAIRAS / i-SpaRo 2026 Workshop · access restricted by the organizers</p>

  async function deriveKey(password, salt) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      "raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]
    );
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" },
      keyMaterial,
      { name: "AES-GCM", length: 256 },

      ["decrypt"]

  }

  function b64ToBuf(b64) {
    const bin = atob(b64);
    const buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    return buf;
  }

  async function decryptHTML(password) {
    const rawPayload = document.getElementById('enc-payload').textContent;
    const payload = JSON.parse(rawPayload);
    const salt = b64ToBuf(payload.salt);
    const iv = b64ToBuf(payload.iv);
    const data = b64ToBuf(payload.data);

    const key = await deriveKey(password, salt);
    const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data);
    return new TextDecoder().decode(decrypted);
  }

  async function tryUnlock(password, save) {
    ERR.hidden = true;
    PASS.classList.remove('shake');
    SUBMIT.disabled = true;

    try {
      const html = await decryptHTML(password);
      if (save) {
        try { localStorage.setItem(STORAGE_KEY, password); } catch(e){}
      }
      document.open();
      document.write(html);
      document.close();
    } catch(err) {
      SUBMIT.disabled = false;
      ERR.hidden = false;
      PASS.classList.add('shake');
      PASS.value = '';
      PASS.focus();
    }
  }

  FORM.addEventListener('submit', function(e) {
    e.preventDefault();
    tryUnlock(PASS.value, REMEMBER.checked);
  });

  // Auto-login if remembered
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) tryUnlock(saved, false);
  } catch(e){}
})();
</script>
