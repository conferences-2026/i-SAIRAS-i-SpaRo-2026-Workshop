<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restricted — i-SAIRAS / i-SpaRo 2026 Workshop</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy:    #070E1A;
    --navy2:   #0D1E35;
    --navy3:   #1B3D6E;
    --cyan:    #00D4FF;
    --cyan2:   #0099CC;
    --gold:    #F5C842;
    --white:   #EEF3FA;
    --muted:   #8BA8C8;
    --border:  rgba(0,212,255,0.15);
    --card-bg: rgba(27,61,110,0.25);
    --error:   #FF6B6B;
  }

  html, body {
    height: 100%;
    background: var(--navy);
    color: var(--white);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    position: relative;
    overflow: hidden;
  }

  /* subtle starfield */
  .stars {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image:
      radial-gradient(1.5px 1.5px at 10% 20%, rgba(255,255,255,0.55), transparent),
      radial-gradient(1px 1px at 80% 10%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1.5px 1.5px at 60% 70%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 30% 85%, rgba(255,255,255,0.35), transparent),
      radial-gradient(1.5px 1.5px at 90% 60%, rgba(255,255,255,0.45), transparent),
      radial-gradient(1px 1px at 45% 35%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1.5px 1.5px at 20% 55%, rgba(255,255,255,0.4), transparent);
    background-repeat: no-repeat;
    pointer-events: none;
    opacity: 0.8;
  }

  .glow {
    position: fixed;
    top: -20%; left: 50%;
    transform: translateX(-50%);
    width: 700px; height: 700px;
    background: radial-gradient(circle, rgba(0,212,255,0.10), transparent 70%);
    pointer-events: none;
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 2.5rem 2.25rem;
    backdrop-filter: blur(10px);
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--cyan);
    margin-bottom: 0.9rem;
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 1.3rem;
    line-height: 1.35;
    margin-bottom: 0.6rem;
  }

  .sub {
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.5;
    margin-bottom: 1.75rem;
  }

  form { display: flex; flex-direction: column; gap: 0.85rem; }

  input[type="password"] {
    width: 100%;
    background: rgba(7,14,26,0.6);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem 0.9rem;
    color: var(--white);
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input[type="password"]::placeholder { color: #5B7393; }
  input[type="password"]:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 0 3px rgba(0,212,255,0.15);
  }
  input[type="password"].shake {
    border-color: var(--error);
    animation: shake 0.32s ease;
  }
  @keyframes shake {
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  button {
    background: var(--cyan);
    color: var(--navy);
    border: none;
    border-radius: 8px;
    padding: 0.75rem 1rem;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 0.92rem;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  button:hover { background: var(--cyan2); }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.6; cursor: wait; }

  .error {
    color: var(--error);
    font-size: 0.83rem;
    margin-top: 0.6rem;
  }

  .remember {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 1.1rem;
    color: var(--muted);
    font-size: 0.82rem;
    cursor: pointer;
    user-select: none;
  }
  .remember input { accent-color: var(--cyan); }

  .footnote {
    margin-top: 1.5rem;
    padding-top: 1.1rem;
    border-top: 1px solid var(--border);
    color: #506070;
    font-size: 0.75rem;
    line-height: 1.5;
  }

  @media (prefers-reduced-motion: reduce) {
    .shake { animation: none; }
  }
</style>
</head>

<div class="stars"></div>
<div class="glow"></div>

<div class="card">

  <h1>Enabling Modularity &amp; Interoperability in Space Robotics</h1>
  <p class="sub">This workshop page is password protected. Enter the password to continue.</p>

  <form id="gate-form" autocomplete="off">

    <button type="submit" id="gate-submit">Unlock →</button>
    <p class="error" id="gate-error" hidden>Incorrect password. Please try again.</p>
  </form>

  <label class="remember">
    <input type="checkbox" id="gate-remember">
    Remember me on this device
  </label>

  <p class="footnote">i-SAIRAS / i-SpaRo 2026 Workshop · access restricted by the organizers</p>
</div>

<script>
(function(){
  const form = document.getElementById('gate-form');
  const input = document.getElementById('gate-password');
  const submitBtn = document.getElementById('gate-submit');
  const errorEl = document.getElementById('gate-error');
  const rememberEl = document.getElementById('gate-remember');
  const STORAGE_KEY = 'isairas2026-gate';

  const payload = JSON.parse(document.getElementById('enc-payload').textContent);

  function b64ToBuf(b64) {
    const bin = atob(b64);
    const buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    return buf;
  }

  async function deriveKey(password, saltBuf, iterations) {
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey(
      'raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveKey']
    );
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: saltBuf, iterations: iterations, hash: 'SHA-256' },
      baseKey,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );
  }

  async function attemptUnlock(password, remember) {
    try {
      const salt = b64ToBuf(payload.salt);
      const iv = b64ToBuf(payload.iv);
      const data = b64ToBuf(payload.data);
      const key = await deriveKey(password, salt, payload.iterations);
      const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, data);
      const html = new TextDecoder().decode(decrypted);

      if (remember) {
        try { localStorage.setItem(STORAGE_KEY, password); } catch (e) {}
      }

      document.open();
      document.write(html);
      document.close();
      return true;
    } catch (e) {
      return false;
    }
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    errorEl.hidden = true;
    input.classList.remove('shake');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Unlocking…';

    const ok = await attemptUnlock(input.value, rememberEl.checked);

    if (!ok) {
      errorEl.hidden = false;
      input.classList.add('shake');
      input.value = '';
      input.focus();
      submitBtn.disabled = false;
      submitBtn.textContent = 'Unlock →';
    }
  });

  // Auto-unlock if a password was remembered earlier this session.
  (async function () {
    let remembered = null;
    try { remembered = localStorage.getItem(STORAGE_KEY); } catch (e) {}
    if (remembered) {
      await attemptUnlock(remembered, true);
    }
  })();
})();
</script>
