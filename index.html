<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invited Speaker - Craig R. Carignan</title>
    <style>
        body {
            background-color: #0d1b2a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background-color: #0b192e;
            padding: 40px;
            border-radius: 8px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .badge {
            display: inline-block;
            background-color: #00406c;
            color: #00b4d8;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            padding: 6px 12px;
            border-radius: 4px;
            text-transform: uppercase;
            margin-bottom: 24px;
        }
        .name {
            color: #00d4ff;
            font-size: 2rem;
            font-weight: 700;
            margin: 0 0 12px 0;
        }
        .affiliation {
            color: #a0aec0;
            font-size: 1.25rem;
            margin: 0 0 24px 0;
            padding-bottom: 24px;
            border-bottom: 1px solid #1e293b;
            font-weight: 500;
        }
        .talk-title {
            color: #cbd5e1;
            font-size: 1.25rem;
            font-style: italic;
            line-height: 1.5;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">Invited Speaker</div>
        <h1 class="name">Craig R. Carignan</h1>
        <div class="affiliation">University of Maryland and NASA / GSFC</div>
        <p class="talk-title">Towards Persistent On-Orbit Platforms for Testing Space Robotic Assembly and Servicing</p>
    </div>
</body>
</html>
